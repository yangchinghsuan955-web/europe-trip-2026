<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2026歐洲極光">
<title>安裝 2026 歐洲極光</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#102d3e,#173f55 55%,#0b2330);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
main{width:min(420px,100%);text-align:center}
.app-icon{width:148px;height:148px;border-radius:32px;box-shadow:0 16px 40px #0007}
h1{margin:18px 0 8px;font-size:30px}
p{margin:0 0 20px;color:#dceaf0}
.steps{display:grid;gap:10px;text-align:left;margin:20px 0}
section{padding:14px 16px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff0d}
section b{display:block;margin-bottom:5px}
section span{color:#dceaf0}
a{display:block;margin-top:16px;padding:14px 18px;border-radius:16px;background:#fff;color:#102d3e;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
<img class="app-icon" src="assets/icon-512.png" alt="2026歐洲極光 App 圖示">
<h1>2026歐洲極光</h1>
<p>把旅行行程加入手機主畫面。</p>
<div class="steps">
<section><b>iPhone / iPad</b><span>Safari → 分享 → 加入主畫面</span></section>
<section><b>Android</b><span>Chrome → 選單 → 加到主畫面／安裝應用程式</span></section>
</div>
<a href="daily/">開啟旅行行程</a>
</main>
<script>
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  location.replace('daily/');
}
</script>
</body>
</html>
