</nav></div><script src="../assets/subpage-runtime.js?v=20260908-nav1"></script><script src="../assets/common.js?v=20260908-nav1"></script><script>(function(){const STORAGE_KEY='aurora-booking-v2';function fix(){document.getElementById('tab-luggage')?.classList.add('active');document.getElementById('luggageSegments')?.style.setProperty('display','flex','important');document.querySelector('#tab-luggage .subview')?.style.setProperty('display','block','important');}function loadChecks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}function saveChecks(checks){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checks))}catch(e){}}function renderBooking(){const list=document.getElementById('bookingList');const template=document.getElementById('bookingTemplate');if(!list||!template)return;list.innerHTML=template.innerHTML;const checks=loadChecks();list.querySelectorAll('[data-booking-check]').forEach(input=>{const id=input.dataset.bookingCheck;input.checked=!!checks[id];input.closest('.check-item')?.classList.toggle('done',input.checked);input.addEventListener('change',()=>{checks[id]=input.checked;input.closest('.check-item')?.classList.toggle('done',input.checked);saveChecks(checks);});});}function bindReset(){const old=document.getElementById('resetChecks');if(!old)return;const fresh=old.cloneNode(true);old.replaceWith(fresh);fresh.addEventListener('click',()=>{if(confirm('確定要清除行前待辦勾選紀錄嗎？')){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}renderBooking();}});}fix();renderBooking();bindReset();document.addEventListener('DOMContentLoaded',()=>{fix();renderBooking();});window.addEventListener('load',fix)})();</script></body></html>
