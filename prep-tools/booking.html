</nav></div><script src="../assets/subpage-runtime.js?v=20260908-nav1"></script><script src="../assets/common.js?v=20260908-nav1"></script><script>(function(){const STORAGE_KEY='aurora-booking-v2';const SECTIONS=[{key:'all',title:'👥 大家都要確認',desc:'每位團員出發前自行完成；入境、行李與退稅細節分別以對應專頁為準',groups:[{title:'📱 01｜網路・旅行 App',desc:'出發前完成網路與必要 App 設定，抵達歐洲後即可直接使用',items:[['all-app-1','完成歐洲 eSIM／SIM 購買'],['all-app-2','確認 eSIM 啟用方式'],['all-app-3','完成「旅行 App」頁面所有必裝 App'],['all-app-4','完成必要 App 帳號註冊／登入'],['all-app-5','完成需要的 App 付款設定'],['all-app-6','測試主要交通 App 可正常登入與使用']]},{title:'📥 02｜個人重要資料離線備份',desc:'即使沒有網路，也能查看自己的行程、票券與重要旅行資料',items:[['all-offline-1','護照資料完成電子備份'],['all-offline-2','自己的航班／交通票券離線保存'],['all-offline-3','自己的門票／活動 Voucher／QR Code 離線保存'],['all-offline-4','eSIM QR Code／設定資料離線保存'],['all-offline-5','有網路時下載離線版旅遊網頁'],['all-offline-6','確認離線版旅遊網頁可正常開啟']]},{title:'🛡️ 03｜申根旅遊保險',desc:'完成旅程所需保險，並準備電子及紙本投保證明',items:[['all-insurance-1','完成申根旅遊保險投保'],['all-insurance-2','確認保障日期涵蓋完整旅程'],['all-insurance-3','確認被保險人姓名／個人資料正確'],['all-insurance-4','下載保單 PDF'],['all-insurance-5','下載英文投保證明'],['all-insurance-6','列印申根保險證明'],['all-insurance-7','列印英文投保證明'],['all-insurance-8','保存保險公司海外緊急聯絡方式']]},{title:'💳 04｜海外付款設定',desc:'建議主卡＋備用卡至少涵蓋 Visa／Mastercard，並盡量使用不同發卡銀行',items:[['all-pay-1','確認主要信用卡與備用信用卡'],['all-pay-2','確認信用卡海外交易功能已開啟'],['all-pay-3','申請／確認信用卡預借現金密碼（PIN）','海外部分實體刷卡機或自助設備可能要求輸入 PIN'],['all-pay-4','確認信用卡 App 可正常登入'],['all-pay-5','開啟海外刷卡／交易通知'],['all-pay-6','確認海外 OTP／交易驗證方式','使用 eSIM 時一併確認台灣門號的驗證方式'],['all-pay-7','DCC 一律選擇當地原幣','歐元區選 EUR・挪威選 NOK・不要選 TWD']]},{title:'🧾 05｜退稅準備',desc:'出發前完成退稅設定與必要資料準備',items:[['all-tax-1','完成「退稅攻略」頁面所有出發前準備'],['all-tax-2','確認退稅資料與文件皆已備妥']]}]},{key:'leader',title:'👑 團長列印清單',desc:'統一準備重要交通、住宿、餐廳、門票與跟團資料紙本，作為手機故障、沒電或無網路時的備援',groups:[{title:'✈️ 01｜機票・長途交通',desc:'列印跨城市／跨國的重要交通票券與訂位確認',items:[['leader-transport-1','9/24｜CI0063｜TPE → VIE'],['leader-transport-2','9/26｜VIE → HEL'],['leader-transport-3','9/27｜HEL → Rovaniemi 臥鋪夜車','Night Train 265'],['leader-transport-4','9/29｜Rovaniemi → Ivalo 長途巴士'],['leader-transport-5','10/1｜Ivalo → Saariselkä 巴士','13:00 出發'],['leader-transport-6','10/2｜Northern Lights Village → Kirkenes 包車','09:30 出發'],['leader-transport-7','10/3｜KKN → TOS'],['leader-transport-8','10/8｜TOS → AMS'],['leader-transport-9','10/10｜AMS → TPE']]},{title:'🏨 02｜飯店住宿',desc:'每間住宿列印一份訂房確認，方便入住及臨時查詢地址',items:[['leader-hotel-1','9/25–9/26｜Vienna','Austria Trend Hotel Europa Wien'],['leader-hotel-2','9/26–9/27｜Helsinki','Scandic Grand Central Helsinki'],['leader-hotel-3','9/28–9/29｜Rovaniemi','Nova Skyland Hotel'],['leader-hotel-4','9/29–10/1｜Ivalo','Kultahippu Hotel & Apartments'],['leader-hotel-5','10/1–10/2｜Saariselkä','Northern Lights Village'],['leader-hotel-6','10/2–10/3｜Kirkenes','Scandic Kirkenes'],['leader-hotel-7','10/3–10/8｜Tromsø','Quality Hotel Grand Tromsø'],['leader-hotel-8','10/8–10/10｜Amsterdam','Amsterdam ID Aparthotel']]},{title:'🍽️ 03｜餐廳訂位',desc:'只列印已有正式訂位的餐廳',items:[['leader-food-1','9/25｜Figlmüller Bäckerstraße','13:00｜6 人'],['leader-food-2','10/2｜Thon 帝王蟹晚餐','Kirkenes｜訂位確認']]},{title:'🎫 04｜門票・入場券',desc:'列印已購、指定日期或指定入場時段的重要門票',items:[['leader-ticket-1','10/10｜Van Gogh Museum 梵谷博物館','門票／QR Code／訂單確認']]},{title:'🚌 05｜跟團・活動預約',desc:'列印已確定活動的 Voucher／訂單確認；極光團抵達當地後再決定，不列入出發前列印',items:[['leader-tour-1','9/30｜伊瓦洛出發：奈利姆村一日遊'],['leader-tour-2','10/4｜特羅姆瑟：塞尼亞中文攝影之旅（含輕食）'],['leader-tour-3','10/6｜峽灣探險之旅（含午餐與攝影指導）'],['leader-tour-4','10/7｜北極峽灣巡遊與釣魚體驗'],['leader-tour-5','10/9｜阿姆斯特丹：從安妮之家出發的運河巡航（8 種語言）']]}]}];function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fix(){document.getElementById('tab-luggage')?.classList.add('active');document.getElementById('luggageSegments')?.style.setProperty('display','flex','important');document.querySelector('#tab-luggage .subview')?.style.setProperty('display','block','important')}function loadChecks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}function saveChecks(checks){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checks))}catch(e){}}function itemHtml(item){return `<label class="check-item"><input type="checkbox" data-booking-check="${esc(item[0])}"><span class="fake-check">✓</span><span class="check-copy"><b>${esc(item[1])}</b>${item[2]?`<small>${esc(item[2])}</small>`:''}</span></label>`}function groupHtml(group){return `<section class="check-group booking-group"><h3>${esc(group.title)}</h3><p class="booking-note">${esc(group.desc)}</p>${group.items.map(itemHtml).join('')}</section>`}function sectionHtml(section){return `<div class="booking-major ${section.key==='leader'?'booking-major--leader':''}"><div class="section-head inner-head"><div><h2>${esc(section.title)}</h2><p>${esc(section.desc)}</p></div></div>${section.groups.map(groupHtml).join('')}</div>`}function updateProgress(list){const inputs=[...list.querySelectorAll('[data-booking-check]')];const done=inputs.filter(i=>i.checked).length;const total=inputs.length;const pct=total?Math.round(done/total*100):0;const el=list.querySelector('[data-booking-progress]');if(el)el.textContent=`行前待辦進度｜已完成 ${done} / ${total} 項（${pct}%）`}function renderBooking(){const list=document.getElementById('bookingList');if(!list)return;list.innerHTML=`<div class="booking-progress" data-booking-progress></div>${SECTIONS.map(sectionHtml).join('')}`;const checks=loadChecks();list.querySelectorAll('[data-booking-check]').forEach(input=>{const id=input.dataset.bookingCheck;input.checked=!!checks[id];input.closest('.check-item')?.classList.toggle('done',input.checked);input.addEventListener('change',()=>{checks[id]=input.checked;input.closest('.check-item')?.classList.toggle('done',input.checked);saveChecks(checks);updateProgress(list)})});updateProgress(list)}function bindReset(){const old=document.getElementById('resetChecks');if(!old)return;const fresh=old.cloneNode(true);old.replaceWith(fresh);fresh.addEventListener('click',()=>{if(confirm('確定要清除行前待辦勾選紀錄嗎？')){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}renderBooking()}})}fix();renderBooking();bindReset();document.addEventListener('DOMContentLoaded',()=>{fix();renderBooking()});window.addEventListener('load',fix)})();</script></body></html>
