name: Validate optimized UI images

on:
  push:
    branches:
      - perf/optimized-ui-images-20260914
    paths:
      - .github/workflows/validate-optimized-ui-images.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimized-ui-images-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Validate image integrity, dimensions, quality and references
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageChops
          import math

          root = Path("assets/skin")
          out = root / "optimized"
          jobs = [
              ("首頁.png", "hero.webp", (1960, 653), 700_000, 30.0),
              ("CEAC510F-7333-464B-A71A-9A98324A0347.png", "nav-daily.webp", (256, 256), 120_000, 30.0),
              ("5CB28D8D-8530-43BD-A822-2122162B9225.png", "nav-transport.webp", (256, 256), 120_000, 30.0),
              ("9A402E72-D080-448D-B7E2-BA94C7BDCD87.png", "nav-stay.webp", (256, 256), 120_000, 30.0),
              ("4F81B1FA-E781-4604-B7FF-7387BB719789.png", "nav-tools.webp", (256, 256), 120_000, 30.0),
              ("E54BF95C-E31A-4067-B470-A61AFDBF7954.png", "nav-budget.webp", (256, 256), 120_000, 30.0),
          ]

          for source_name, output_name, expected_size, byte_limit, min_psnr in jobs:
              target = out / output_name
              assert target.exists(), f"Missing {target}"
              assert target.stat().st_size <= byte_limit, f"{target} exceeds size limit"
              with Image.open(root / source_name) as original:
                  original.load()
                  reference = original.convert("RGB").resize(expected_size, Image.Resampling.LANCZOS)
              with Image.open(target) as optimized:
                  optimized.load()
                  assert optimized.size == expected_size, f"Wrong dimensions for {target}: {optimized.size}"
                  candidate = optimized.convert("RGB")
              diff = ImageChops.difference(reference, candidate)
              histogram = diff.histogram()
              squared = sum((value % 256) ** 2 * count for value, count in enumerate(histogram))
              mse = squared / (expected_size[0] * expected_size[1] * 3)
              psnr = float("inf") if mse == 0 else 20 * math.log10(255 / math.sqrt(mse))
              assert psnr >= min_psnr, f"{target} PSNR {psnr:.2f} below {min_psnr}"
              print(f"{output_name}: {expected_size[0]}x{expected_size[1]}, {target.stat().st_size} bytes, PSNR {psnr:.2f} dB")

          common = Path("assets/common.css").read_text(encoding="utf-8")
          hero_css = Path("assets/skin-hero-approved.css").read_text(encoding="utf-8")
          expected_refs = [
              "optimized/nav-daily.webp", "optimized/nav-transport.webp",
              "optimized/nav-stay.webp", "optimized/nav-tools.webp",
              "optimized/nav-budget.webp"
          ]
          assert all(ref in common for ref in expected_refs)
          assert "optimized/hero.webp" in hero_css
          old_refs = [
              "CEAC510F-7333-464B-A71A-9A98324A0347.png",
              "5CB28D8D-8530-43BD-A822-2122162B9225.png",
              "9A402E72-D080-448D-B7E2-BA94C7BDCD87.png",
              "4F81B1FA-E781-4604-B7FF-7387BB719789.png",
              "E54BF95C-E31A-4067-B470-A61AFDBF7954.png",
          ]
          assert not any(ref in common for ref in old_refs)
          assert "首頁.png" not in hero_css
          print("CSS references verified")
