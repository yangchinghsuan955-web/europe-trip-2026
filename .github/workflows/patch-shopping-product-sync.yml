name: Patch shopping product sync
on:
  push:
    paths:
      - .github/workflows/patch-shopping-product-sync.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch shopping product add and remove behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('budget/index.html')
          s = p.read_text(encoding='utf-8')

          css_old = '.empty-list{padding:18px 0;color:var(--muted);text-align:center}.device-note{margin-top:10px;color:var(--muted);font-size:12px}.image-modal{'
          css_new = '.empty-list{padding:18px 0;color:var(--muted);text-align:center}.device-note{margin-top:10px;color:var(--muted);font-size:12px}.add-shopping.is-added{background:#eef8f5;color:var(--navy);border-color:#7fb6be;cursor:default}.add-shopping.is-added:disabled{opacity:1}.remove-shopping{border:0;background:transparent;color:var(--red);font-weight:750;cursor:pointer;padding:5px 8px}.shopping-product-row>.remove-shopping{grid-column:3;justify-self:end}.shopping-toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:140;width:min(92vw,540px);box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid rgba(127,182,190,.7);border-radius:16px;background:rgba(250,255,253,.97);color:var(--navy);box-shadow:0 8px 24px rgba(16,45,62,.16);font-size:13px;font-weight:750}.shopping-toast[hidden]{display:none}.shopping-toast button{border:0;background:transparent;color:var(--blue);font-weight:800;white-space:nowrap;cursor:pointer}@media(max-width:620px){.shopping-product-row>.remove-shopping{grid-column:2;justify-self:start;margin-top:-4px}}.image-modal{'
          assert css_old in s, 'CSS anchor not found'
          s = s.replace(css_old, css_new, 1)

          save_old = "  function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}\n  function setBackupStatus(message){const el=$('#shoppingBackupStatus');if(el)el.textContent=message||''}"
          save_new = r'''  function normalizeCountry(value){return String(value||'其他').replace(/^[^A-Za-z\u3400-\u9fff]+/,'').trim()||'其他'}
  function hashText(value){let h=2166136261;for(let i=0;i<String(value).length;i++){h^=String(value).charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
  function recommendationId(name,country){
    const targetName=String(name||'').trim(),targetCountry=normalizeCountry(country),matches=[];
    (data.supermarkets||[]).forEach(x=>{if(normalizeCountry(x.city)!==targetCountry)return;(x.groups||[]).forEach(g=>(g.products||[]).forEach(p=>{if(String(p.item||'').trim()===targetName)matches.push(p)}))});
    (data.souvenirs||[]).forEach(p=>{if(normalizeCountry(p.country)===targetCountry&&String(p.item||'').trim()===targetName)matches.push(p)});
    const preferred=matches.find(p=>p&&p.source)||matches.find(p=>p&&p.image)||matches[0]||{};
    const base=preferred.source?'src:'+preferred.source:preferred.image?'img:'+preferred.image:'item:'+targetCountry+'|'+targetName;
    return 'rec-'+hashText(base)
  }
  function recommendedIndex(button,migrate=true){
    if(!button)return -1;
    const name=String(button.dataset.addItem||'').trim(),country=normalizeCountry(button.dataset.addCountry||'其他'),id=button.dataset.productId||recommendationId(name,country);
    button.dataset.productId=id;
    let i=items.findIndex(x=>x&&x.sourceId===id);
    if(i<0)i=items.findIndex(x=>x&&String(x.name||'').trim()===name&&normalizeCountry(x.country)===country);
    if(i>=0&&migrate&&!items[i].sourceId){items[i].sourceId=id;items[i].sourceType='recommendation';localStorage.setItem(KEY,JSON.stringify(items))}
    return i
  }
  function syncRecommendationButtons(){
    $$('#supermarketList [data-add-item], #souvenirList [data-add-item]').forEach(button=>{
      const i=recommendedIndex(button),added=i>=0,id=button.dataset.productId;
      button.textContent=added?'✓ 已加入清單':'＋ 加入購物清單';button.disabled=added;button.classList.toggle('is-added',added);button.setAttribute('aria-pressed',added?'true':'false');
      const row=button.parentElement;if(!row)return;
      row.querySelectorAll('.remove-shopping').forEach(x=>{if(x.dataset.removeProductId!==id||!added)x.remove()});
      if(added&&!row.querySelector('.remove-shopping[data-remove-product-id="'+id+'"]')){const remove=document.createElement('button');remove.type='button';remove.className='remove-shopping';remove.dataset.removeProductId=id;remove.dataset.removeItem=button.dataset.addItem||'';remove.dataset.removeCountry=button.dataset.addCountry||'其他';remove.textContent='取消加入';row.appendChild(remove)}
    })
  }
  let toastTimer;
  function showShoppingToast(message,showView=false){
    let toast=$('#shoppingToast');
    if(!toast){toast=document.createElement('div');toast.id='shoppingToast';toast.className='shopping-toast';toast.hidden=true;toast.innerHTML='<span></span><button type="button">查看清單</button>';document.body.appendChild(toast);toast.querySelector('button').addEventListener('click',()=>{const segment=$$('#foodSegments .segment').find(x=>x.dataset.foodView==='shopping');if(segment)segment.click();toast.hidden=true})}
    toast.querySelector('span').textContent=message;toast.querySelector('button').hidden=!showView;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},2200)
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(items));render();syncRecommendationButtons()}
  function setBackupStatus(message){const el=$('#shoppingBackupStatus');if(el)el.textContent=message||''}'''
          assert save_old in s, 'save anchor not found'
          s = s.replace(save_old, save_new, 1)

          normalize_old = "  function normalizeBackupItems(rows){if(!Array.isArray(rows))throw new Error('備份格式不正確');return rows.filter(x=>x&&typeof x.name==='string'&&x.name.trim()).map(x=>({name:String(x.name).trim().slice(0,80),country:String(x.country||'其他').slice(0,20),city:String(x.city||'').slice(0,40),qty:Math.max(1,Math.min(999,Number(x.qty)||1)),budget:String(x.budget||'').slice(0,30),forWho:String(x.forWho||'').slice(0,50),note:String(x.note||'').slice(0,180),done:!!x.done}))}"
          normalize_new = "  function normalizeBackupItems(rows){if(!Array.isArray(rows))throw new Error('備份格式不正確');return rows.filter(x=>x&&typeof x.name==='string'&&x.name.trim()).map(x=>({name:String(x.name).trim().slice(0,80),country:String(x.country||'其他').slice(0,20),city:String(x.city||'').slice(0,40),qty:Math.max(1,Math.min(999,Number(x.qty)||1)),budget:String(x.budget||'').slice(0,30),forWho:String(x.forWho||'').slice(0,50),note:String(x.note||'').slice(0,180),done:!!x.done,sourceId:typeof x.sourceId==='string'?x.sourceId.slice(0,80):'',sourceType:x.sourceType==='recommendation'?'recommendation':''}))}"
          assert normalize_old in s, 'backup normalize anchor not found'
          s = s.replace(normalize_old, normalize_new, 1)

          edit_old = "  $('#saveShopItem').addEventListener('click',()=>{const name=$('#shopName').value.trim();if(!name){$('#shopName').focus();return}const obj={name,country:$('#shopCountry').value,city:$('#shopCity').value.trim(),qty:Math.max(1,Math.min(999,Number($('#shopQty').value)||1)),budget:$('#shopBudget').value.trim(),forWho:$('#shopFor').value.trim(),note:$('#shopNote').value.trim(),done:editing>=0?!!items[editing].done:false};if(editing>=0)items[editing]=obj;else items.push(obj);save();resetForm()});"
          edit_new = "  $('#saveShopItem').addEventListener('click',()=>{const name=$('#shopName').value.trim();if(!name){$('#shopName').focus();return}const old=editing>=0?items[editing]:null,obj={name,country:$('#shopCountry').value,city:$('#shopCity').value.trim(),qty:Math.max(1,Math.min(999,Number($('#shopQty').value)||1)),budget:$('#shopBudget').value.trim(),forWho:$('#shopFor').value.trim(),note:$('#shopNote').value.trim(),done:old?!!old.done:false,sourceId:old&&old.sourceId||'',sourceType:old&&old.sourceType||''};if(editing>=0)items[editing]=obj;else items.push(obj);save();resetForm()});"
          assert edit_old in s, 'edit anchor not found'
          s = s.replace(edit_old, edit_new, 1)

          add_old = "  $('#souvenirList').addEventListener('click',e=>{const b=e.target.closest('[data-add-item]');if(!b)return;items.push({name:b.dataset.addItem,country:b.dataset.addCountry||'其他',city:'',qty:1,budget:'',forWho:'',note:'',done:false});save();$$('#foodSegments .segment').find(x=>x.dataset.foodView==='shopping').click()});"
          add_new = r'''  function handleRecommendationAction(e){
    const add=e.target.closest('[data-add-item]');
    if(add){
      e.preventDefault();
      if(recommendedIndex(add,false)>=0){syncRecommendationButtons();return}
      const name=String(add.dataset.addItem||'').trim(),country=normalizeCountry(add.dataset.addCountry||'其他'),sourceId=add.dataset.productId||recommendationId(name,country);
      items.push({name,country,city:'',qty:1,budget:'',forWho:'',note:'',done:false,sourceId,sourceType:'recommendation'});save();showShoppingToast('✓ '+name+' 已加入購物清單',true);return
    }
    const remove=e.target.closest('[data-remove-product-id]');
    if(!remove)return;
    e.preventDefault();
    const sourceId=remove.dataset.removeProductId,name=String(remove.dataset.removeItem||'').trim(),country=normalizeCountry(remove.dataset.removeCountry||'其他');
    let i=items.findIndex(x=>x&&x.sourceId===sourceId);if(i<0)i=items.findIndex(x=>x&&String(x.name||'').trim()===name&&normalizeCountry(x.country)===country);
    if(i>=0){const removedName=items[i].name||name;items.splice(i,1);save();if(editing===i)resetForm();showShoppingToast(removedName+' 已從購物清單移除')}
  }
  $('#supermarketList').addEventListener('click',handleRecommendationAction);
  $('#souvenirList').addEventListener('click',handleRecommendationAction);'''
          assert add_old in s, 'old add handler not found'
          s = s.replace(add_old, add_new, 1)

          render_old = "  render();\n  const trip=new Date('2026-09-24T21:30:00+08:00')"
          render_new = "  render();requestAnimationFrame(syncRecommendationButtons);document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(syncRecommendationButtons));\n  const trip=new Date('2026-09-24T21:30:00+08:00')"
          assert render_old in s, 'render anchor not found'
          s = s.replace(render_old, render_new, 1)

          assert "find(x=>x.dataset.foodView==='shopping').click()" not in s, 'automatic shopping-tab jump still exists'
          assert "$('#supermarketList').addEventListener('click',handleRecommendationAction)" in s
          assert "$('#souvenirList').addEventListener('click',handleRecommendationAction)" in s
          assert "✓ 已加入清單" in s and "取消加入" in s
          assert "sourceId" in s and "sourceType:'recommendation'" in s
          assert 'shopping-toast' in s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate patched page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('budget/index.html').read_text(encoding='utf-8')
          assert s.count('aria-current="page"') == 1
          assert 'navigator.canShare' in s
          assert 'aurora-shopping-list-v1' in s
          assert 'handleRecommendationAction' in s
          assert "find(x=>x.dataset.foodView==='shopping').click()" not in s
          print('budget shopping sync patch validated')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add budget/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Keep product browsing while syncing shopping list'
          git push origin main
