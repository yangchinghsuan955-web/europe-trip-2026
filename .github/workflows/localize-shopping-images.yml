name: Localize shopping images
on:
  push:
    paths:
      - .github/workflows/localize-shopping-images.yml
jobs:
  localize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download shopping images into assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow requests
          python3 <<'PY'
          from pathlib import Path
          from io import BytesIO
          import json, requests
          from PIL import Image, ImageOps

          rows = [
            ("Kelly's Chips Classic", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-288648-0238714879-r0x0DHnP.jpg", "vienna/kellys-chips-classic.png"),
            ("Alnatura Dinkel Mini Brezeln", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-317554-0205337684-XwaPDwoj.jpg", "vienna/alnatura-dinkel-mini-brezeln.png"),
            ("Ritter Sport Nussklasse Pistazie", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-762363-1106946824-9LqwSc_4.jpg", "vienna/ritter-sport-pistazie.png"),
            ("Lindt Dubai Style Chocolade", "https://www.lindt.fr/media/catalog/product/1/5/15defbc343c8752663febf2acfff2e25d51ca99d2314d62d56d665def29f6a93.png?canvas=700%3A700&fit=bounds&height=700&quality=80&width=700", "vienna/lindt-dubai-style.png"),
            ("Almdudler", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-770082-0195532897-9iLfag6m.jpg", "vienna/almdudler.png"),
            ("Manner Original Neapolitaner 威化餅", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-790860-0728303564-6RlkpIg_.jpg", "vienna/manner-original-neapolitaner.png"),
            ("Darbo Rosenmarillen Konfitüre", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-878190-0471765227-Jcm0VeKV.jpg", "vienna/darbo-rosenmarillen.png"),
            ("DEMEL Kandierte Veilchen 糖漬紫羅蘭", "https://www.demel.com/cdn/shop/products/Candied_Violets_04.webp?v=1681826075&width=1600", "vienna/demel-candied-violets.png"),
            ("Zotter 巧克力", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-899847-0105233692-_WstWtlg.jpg", "vienna/zotter-chocolate.png"),
            ("Clinical Melatonin Forte Original", "https://products.dm-static.com/images/f_auto%2Cq_auto%2Cc_fit%2Ch_1200%2Cw_1200/v1762776486/assets/pas/images/d3c134c5-39aa-4244-9f68-5b799f73edd7/clinical-melatonin-melatonin-forte-original", "vienna/clinical-melatonin-forte.png"),
            ("Balea Hyaluron Konzentrat（藍色補水款）", "https://products.dm-static.com/images/f_auto%2Cq_auto%2Cc_fit%2Ch_1200%2Cw_1200/v1771941372/assets/pas/images/3611250c-02c3-4986-89b6-abc68aa1c8dc/balea-hyaluron-konzentrat", "vienna/balea-hyaluron-konzentrat.png"),
            ("Ferrero Giotto 榛果威化小球", "https://images.cdn.europe-west1.gcp.commercetools.com/723b2575-66c7-4d92-ae49-82bf1d168d26/00-407313-0160604677-CMrA_lkC.jpg", "vienna/ferrero-giotto.png"),
            ("Ovomaltine Crunchy Cream", "https://www.ovomaltine.com/sites/ovomaltine.com/files/07612100915233.png", "finland/ovomaltine-crunchy-cream.png"),
            ("Paulig Juhla Mokka", "https://cdn.s-cloud.fi/v1/w1440h1440%40_q85/assets/dam-id/110bN8NA4gvB2pOkhk2fbB.webp", "finland/paulig-juhla-mokka.png"),
            ("Nordqvist Moomin Tea", "https://nordqvist.fi/cdn/shop/files/paeivaen-paras-hetki-pussitee-uusi-design-nordqvist-teekauppa-122.jpg?v=1757944728&width=1800", "finland/nordqvist-moomin-tea.png"),
            ("Nordqvist SUOMI Blueberry Tea", "https://cdn.s-cloud.fi/v1/w1440h1440%40_q85/assets/dam-id/7IkephA2a4k8beGyMhiA6T.webp", "finland/nordqvist-suomi-blueberry-tea.png"),
            ("Fazer Cacao", "https://fazerpro.fazer.com/globalassets/fc_fi_856230_fazer-cacao-200g_web.png", "finland/fazer-cacao.png"),
            ("Lumene 保養品", "https://lumene.com/cdn/shop/files/297_bca3ae5d-04e5-4369-be3b-e05ee01a19b3.jpg?v=1750739654&width=1600", "finland/lumene-skincare.png")
          ]

          root = Path('assets/shopping')
          session = requests.Session()
          session.headers.update({
            'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
            'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'
          })
          success = {}
          failed = []
          for name, url, rel in rows:
            dest = root / rel
            dest.parent.mkdir(parents=True, exist_ok=True)
            try:
              r = session.get(url, timeout=25, allow_redirects=True)
              r.raise_for_status()
              img = Image.open(BytesIO(r.content))
              img = ImageOps.exif_transpose(img)
              if img.mode not in ('RGB','RGBA'):
                img = img.convert('RGBA' if 'transparency' in img.info else 'RGB')
              img.thumbnail((900, 900), Image.Resampling.LANCZOS)
              img.save(dest, 'PNG', optimize=True)
              success[name] = '../assets/shopping/' + rel
              print('OK', name, '->', rel, dest.stat().st_size)
            except Exception as exc:
              failed.append((name, str(exc)))
              print('WARN', name, exc)

          required = ['Manner Original Neapolitaner 威化餅', 'Darbo Rosenmarillen Konfitüre']
          missing_required = [x for x in required if x not in success]
          if missing_required:
            raise SystemExit('Required local images failed: ' + ', '.join(missing_required))

          p = Path('assets/finland-shopping-extra.js')
          s = p.read_text(encoding='utf-8')
          start = '  /* LOCAL SHOPPING ASSET OVERRIDES START */'
          end = '  /* LOCAL SHOPPING ASSET OVERRIDES END */\n'
          if start in s:
            a = s.index(start)
            b = s.index(end, a) + len(end)
            s = s[:a] + s[b:]
          marker = '  var sourceMap={'
          if marker not in s:
            raise SystemExit('sourceMap marker not found')
          lines = [start, '  var localAssetMap={']
          pairs = list(success.items())
          for i, (name, path) in enumerate(pairs):
            comma = ',' if i < len(pairs)-1 else ''
            lines.append('    ' + json.dumps(name, ensure_ascii=False) + ':' + json.dumps(path, ensure_ascii=False) + comma)
          lines += [
            '  };',
            '  Object.keys(localAssetMap).forEach(function(name){imageMap[name]=localAssetMap[name];fullImageMap[name]=localAssetMap[name];});',
            end.rstrip('\n')
          ]
          block = '\n'.join(lines) + '\n\n'
          s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')

          b = Path('budget/index.html')
          html = b.read_text(encoding='utf-8')
          import re
          html = re.sub(r'(<script src="\.\./assets/finland-shopping-extra\.js)(?:\?v=[^"]*)?("></script>)', r'\1?v=20260908-assets1\2', html, count=1)
          b.write_text(html, encoding='utf-8')

          Path('/tmp/shopping-localization.json').write_text(json.dumps({'success': success, 'failed': failed}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Localized', len(success), 'images; failed', len(failed))
          PY
      - name: Validate localized assets
        shell: bash
        run: |
          test -s assets/shopping/vienna/manner-original-neapolitaner.png
          test -s assets/shopping/vienna/darbo-rosenmarillen.png
          grep -q 'LOCAL SHOPPING ASSET OVERRIDES START' assets/finland-shopping-extra.js
          grep -q 'manner-original-neapolitaner.png' assets/finland-shopping-extra.js
          grep -q 'darbo-rosenmarillen.png' assets/finland-shopping-extra.js
          grep -q 'finland-shopping-extra.js?v=20260908-assets1' budget/index.html
      - name: Commit localized shopping images
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/shopping assets/finland-shopping-extra.js budget/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Localize shopping images for reliable sharing'
          git push origin main
