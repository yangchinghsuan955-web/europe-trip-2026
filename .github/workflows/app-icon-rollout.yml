name: Roll out home screen app icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-icon-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add app icon metadata to every trip page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('index.html'), Path('daily'), Path('transport'), Path('stay'), Path('budget'), Path('prep-tools')]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(sorted(root.rglob('*.html')))

          for path in files:
              text = path.read_text(encoding='utf-8')
              if '<head' not in text.lower() or '</head>' not in text.lower():
                  continue

              depth = len(path.parent.parts)
              prefix = '../' * depth
              manifest = f'{prefix}manifest.webmanifest'
              apple_icon = f'{prefix}assets/apple-touch-icon.png'
              favicon = f'{prefix}assets/favicon-32.png'

              # Keep the standalone app name consistent across every page.
              if re.search(r'<meta\s+name=["\']apple-mobile-web-app-title["\'][^>]*>', text, flags=re.I):
                  text = re.sub(
                      r'<meta\s+name=["\']apple-mobile-web-app-title["\'][^>]*>',
                      '<meta name="apple-mobile-web-app-title" content="2026歐洲極光">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              additions = []
              checks = [
                  ('mobile-web-app-capable', '<meta name="mobile-web-app-capable" content="yes">'),
                  ('apple-mobile-web-app-capable', '<meta name="apple-mobile-web-app-capable" content="yes">'),
                  ('apple-mobile-web-app-title', '<meta name="apple-mobile-web-app-title" content="2026歐洲極光">'),
              ]
              for key, tag in checks:
                  if not re.search(rf'<meta\s+name=["\']{re.escape(key)}["\']', text, flags=re.I):
                      additions.append(tag)

              if not re.search(r'<link\s+[^>]*rel=["\']manifest["\']', text, flags=re.I):
                  additions.append(f'<link rel="manifest" href="{manifest}">')
              if not re.search(r'<link\s+[^>]*rel=["\']apple-touch-icon["\']', text, flags=re.I):
                  additions.append(f'<link rel="apple-touch-icon" sizes="180x180" href="{apple_icon}">')
              if not re.search(r'<link\s+[^>]*rel=["\']icon["\'][^>]*sizes=["\']32x32["\']', text, flags=re.I):
                  additions.append(f'<link rel="icon" type="image/png" sizes="32x32" href="{favicon}">')

              if additions:
                  block = '\n' + '\n'.join(additions) + '\n'
                  text = re.sub(r'</head>', block + '</head>', text, count=1, flags=re.I)
                  path.write_text(text, encoding='utf-8')
                  print(f'updated {path}')

          PY

      - name: Commit rollout and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html daily transport stay budget prep-tools
          git rm .github/workflows/app-icon-rollout.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Enable home screen icon on all trip pages"
          git push
