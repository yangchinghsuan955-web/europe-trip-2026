name: Optimize Finland shopping images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-finland-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image libraries
        run: pip install pillow pillow-avif-plugin requests

      - name: Build optimized Finland images and data mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_avif
          import requests, io, shutil

          root=Path('assets/shopping/finland')
          thumbs=root/'thumbs'
          large=root/'large'
          shutil.rmtree(thumbs, ignore_errors=True)
          shutil.rmtree(large, ignore_errors=True)
          thumbs.mkdir(parents=True, exist_ok=True)
          large.mkdir(parents=True, exist_ok=True)

          sources={
            'Bonne-Premium-Mustikkamehu.png':('https://www.bonnejuomat.fi/client/bonne2020/userfiles/bonne-mustikka-1l1348910838.png','assets/shopping/finland/bonne-premium-mustikkamehu.webp'),
            'Finnair-Blueberry-Juice.png':('https://public.keskofiles.com/f/k-ruoka/product/6415130048916?auto=format&cs=srgb&fit=max&fm=png&h=1400&w=1400','assets/shopping/finland/finnair-blueberry-juice-drink.webp'),
            'Valio-Puolukka-Karpalo.png':(None,'assets/shopping/norway/Valio Hedelmätarha Luomu Puolukka-Karpalo.avif'),
            'Froosh-Smoothie.png':('https://public.keskofiles.com/f/k-ruoka/product/7350020720758?auto=format&cs=srgb&fit=max&fm=png&h=1400&w=1400','assets/shopping/finland/froosh-smoothie.webp'),
            'Kelloggs-Tresor-Choco-Nougat.png':('https://media.cdn.kaufland.de/product-images/2048x2048/7ae15e6938234a95cee0a422cca46fba.webp','assets/shopping/finland/kelloggs-tresor.webp'),
            'Ovomaltine-Crunchy-Cream.png':('https://www.ovomaltine.com/sites/ovomaltine.com/files/07612100915233.png','assets/shopping/finland/ovomaltine-crunchy-cream.png'),
            'Karl-Fazer-Blue.png':('https://images.partyking.org/fit-in/1300x0/products/original/karl-fazer-mjolkchoklad-chokladkaka-2.jpg','assets/shopping/finland/karl-fazer-blue.webp'),
            'Karl-Fazer-Dark-70.png':('https://fazerpro.fazer.com/globalassets/402162_karl_fazer_thins_dark_70_cocoa_95g.png','assets/shopping/finland/karl-fazer-dark-70.webp'),
            'Moomin-Liquorice.png':('https://kouvolanlakritsi.fi/cdn/shop/files/muumimamma_1.jpg?v=1719484242&width=1445','assets/shopping/finland/moomin-liquorice.webp'),
            'Paulig-Juhla-Mokka.png':('https://cdn.s-cloud.fi/v1/w1440h1440%40_q85/assets/dam-id/110bN8NA4gvB2pOkhk2fbB.webp','assets/shopping/finland/paulig-juhla-mokka.png'),
            'Nordqvist-Moomin-Tea.png':('https://nordqvist.fi/cdn/shop/files/paeivaen-paras-hetki-pussitee-uusi-design-nordqvist-teekauppa-122.jpg?v=1757944728&width=1800','assets/shopping/finland/nordqvist-moomin-tea.png'),
            'Nordqvist-SUOMI-Blueberry-Tea.png':('https://cdn.s-cloud.fi/v1/w1440h1440%40_q85/assets/dam-id/7IkephA2a4k8beGyMhiA6T.webp','assets/shopping/finland/nordqvist-suomi-blueberry-tea.png'),
            'Fazer-Cacao.png':('https://fazerpro.fazer.com/globalassets/fc_fi_856230_fazer-cacao-200g_web.png','assets/shopping/finland/fazer-cacao.png'),
            'Fazer-Cafe-Chocolate.png':(None,'assets/shopping/norway/Fazer Café 巧克力.jpg'),
            'Moomin-Collaboration.png':(None,'assets/shopping/norway/Moomin 周邊／ARABIA・Iittala・Marimekko 聯名.jpg'),
            'Lumene-Skincare.png':('https://lumene.com/cdn/shop/files/297_bca3ae5d-04e5-4369-be3b-e05ee01a19b3.jpg?v=1750739654&width=1600','assets/shopping/finland/lumene-skincare.png'),
            'Marttiini-Reindeer-Leather-Gloves.png':(None,'assets/shopping/norway/Marttiini 馴鹿皮手套.webp'),
          }

          def load_image(remote, fallback):
            if remote:
              try:
                r=requests.get(remote,timeout=30,headers={'User-Agent':'Mozilla/5.0'}); r.raise_for_status()
                return Image.open(io.BytesIO(r.content))
              except Exception as e:
                print('remote fallback:',remote,e)
            p=Path(fallback)
            if not p.exists():
              fallbacks={
                'assets/shopping/norway/Valio Hedelmätarha Luomu Puolukka-Karpalo.avif':'assets/shopping/finland/valio-puolukka-karpalo.webp',
                'assets/shopping/norway/Fazer Café 巧克力.jpg':'assets/shopping/finland/fazer-cafe-selection-thumb.png',
                'assets/shopping/norway/Moomin 周邊／ARABIA・Iittala・Marimekko 聯名.jpg':'assets/shopping/finland/moomin-souvenir.svg',
                'assets/shopping/norway/Marttiini 馴鹿皮手套.webp':'assets/shopping/finland/marttiini-reindeer-gloves.svg',
              }
              p=Path(fallbacks.get(fallback,fallback))
            return Image.open(p)

          def prepare(im):
            im=ImageOps.exif_transpose(im)
            if im.mode not in ('RGB','RGBA'):
              im=im.convert('RGBA' if 'transparency' in im.info else 'RGB')
            return im

          def quantize(im,colors):
            if im.mode=='RGBA':
              return im.quantize(colors=colors,method=Image.Quantize.FASTOCTREE,dither=Image.Dither.FLOYDSTEINBERG)
            return im.quantize(colors=colors,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.FLOYDSTEINBERG)

          for output,(remote,fallback) in sources.items():
            with load_image(remote,fallback) as opened:
              base=prepare(opened)
              t=base.copy(); t.thumbnail((320,320),Image.Resampling.LANCZOS)
              quantize(t,192).save(thumbs/output,format='PNG',optimize=True,compress_level=9)
              f=base.copy(); f.thumbnail((1000,1000),Image.Resampling.LANCZOS)
              quantize(f,256).save(large/output,format='PNG',optimize=True,compress_level=9)

          print('thumb MB',round(sum(x.stat().st_size for x in thumbs.glob('*.png'))/1024/1024,2))
          print('large MB',round(sum(x.stat().st_size for x in large.glob('*.png'))/1024/1024,2))

          js=r'''(function(){
            var data=window.AURORA_SHOPPING_DATA;
            if(!data)return;
            var base='../assets/shopping/finland/';
            var version='?v=20260909-finland1';
            function local(path){return encodeURI(base+path)+version}
            var files={
              'Bonne Premium Mustikkamehu':'Bonne-Premium-Mustikkamehu.png',
              'Finnair Blueberry Juice Drink':'Finnair-Blueberry-Juice.png',
              'Valio Hedelmätarha Luomu Puolukka-Karpalo':'Valio-Puolukka-Karpalo.png',
              'Froosh Smoothie':'Froosh-Smoothie.png',
              'Kellogg’s Trésor Choco Nougat':'Kelloggs-Tresor-Choco-Nougat.png',
              'Ovomaltine Crunchy Cream':'Ovomaltine-Crunchy-Cream.png',
              'Karl Fazer Blue':'Karl-Fazer-Blue.png',
              'Karl Fazer Dark 70%':'Karl-Fazer-Dark-70.png',
              'Moomin Liquorice':'Moomin-Liquorice.png',
              'Paulig Juhla Mokka':'Paulig-Juhla-Mokka.png',
              'Nordqvist Moomin Tea':'Nordqvist-Moomin-Tea.png',
              'Nordqvist SUOMI Blueberry Tea':'Nordqvist-SUOMI-Blueberry-Tea.png',
              'Fazer Cacao':'Fazer-Cacao.png',
              'Fazer Café 巧克力':'Fazer-Cafe-Chocolate.png',
              'Moomin 周邊／ARABIA・Iittala・Marimekko 聯名':'Moomin-Collaboration.png',
              'Lumene 保養品':'Lumene-Skincare.png',
              'Marttiini 馴鹿皮手套':'Marttiini-Reindeer-Leather-Gloves.png'
            };
            function decorate(p){
              var file=p&&files[p.item]; if(!file)return p;
              p.image=local('thumbs/'+file); p.imageFull=local('large/'+file); p.fullImage=p.imageFull; return p;
            }
            var marketOnly=new Set(['Bonne Premium Mustikkamehu','Finnair Blueberry Juice Drink','Valio Hedelmätarha Luomu Puolukka-Karpalo','Froosh Smoothie','Kellogg’s Trésor Choco Nougat','Ovomaltine Crunchy Cream']);
            var finland=(data.supermarkets||[]).find(function(x){return String(x.city||'').indexOf('芬蘭')>=0});
            if(finland){
              finland.items=Array.from(marketOnly);
              finland.groups=(finland.groups||[]).map(function(g){
                g.products=(g.products||[]).filter(function(p){return marketOnly.has(p.item)}).map(decorate);
                return g;
              }).filter(function(g){return g.products.length>0});
              finland.note='芬蘭超市頁只保留旅途中直接吃喝／早餐備糧；可帶回台灣的代表性商品統一放到「伴手禮推薦」，避免兩頁重複。';
            }
            data.souvenirs=(data.souvenirs||[]).filter(function(x){return String(x.country||'').indexOf('芬蘭')<0});
            var rows=[
              {country:'🇫🇮 芬蘭',category:'⭐ 芬蘭代表',priority:'⭐ 必買',item:'Karl Fazer Blue',reason:'經典芬蘭牛奶巧克力，辨識度高、好分送，是最適合帶回台灣的芬蘭代表商品之一。',place:'芬蘭各大超市／Fazer',tag:'芬蘭代表'},
              {country:'🇫🇮 芬蘭',category:'⭐ 芬蘭代表',priority:'⭐ 必買',item:'Paulig Juhla Mokka',reason:'芬蘭經典咖啡，最能代表芬蘭日常咖啡文化，適合咖啡族或送禮。',place:'芬蘭各大超市',tag:'芬蘭咖啡'},
              {country:'🇫🇮 芬蘭',category:'🍫 Fazer 巧克力',priority:'👍 推薦',item:'Karl Fazer Dark 70%',reason:'70% 黑巧克力，甜度較低，適合不嗜甜者、長輩或自用。',place:'芬蘭各大超市／Fazer',tag:'黑巧克力'},
              {country:'🇫🇮 芬蘭',category:'🍫 Fazer 巧克力',priority:'⭐ 必買',item:'Fazer Café 巧克力',reason:'Fazer Café／Fazer 商店相關巧克力，紀念性比一般超市款更高，可優先挑限定包裝或禮盒。',place:'Fazer Café／Fazer 商店',tag:'Fazer 限定'},
              {country:'🇫🇮 芬蘭',category:'🍫 Fazer 巧克力',priority:'👍 推薦',item:'Fazer Cacao',reason:'Fazer 可可粉，常溫好帶，適合熱可可、烘焙或喜歡可可風味的人。',place:'芬蘭各大超市',tag:'可可粉'},
              {country:'🇫🇮 芬蘭',category:'🦛 嚕嚕米食品',priority:'👍 推薦',item:'Nordqvist Moomin Tea',reason:'嚕嚕米茶包輕巧、包裝可愛，芬蘭特色明確，很適合當小型伴手禮。',place:'超市／Moomin 商店',tag:'嚕嚕米茶'},
              {country:'🇫🇮 芬蘭',category:'🦛 嚕嚕米食品',priority:'👍 推薦',item:'Moomin Liquorice',reason:'嚕嚕米甘草糖，包裝很有芬蘭特色；甘草風味較挑人，適合少量購買。',place:'超市／Moomin 商店',tag:'甘草糖'},
              {country:'🇫🇮 芬蘭',category:'🫐 芬蘭莓果',priority:'👍 推薦',item:'Nordqvist SUOMI Blueberry Tea',reason:'SUOMI 藍莓風味茶兼具芬蘭與莓果意象，比果汁輕巧、適合帶回台灣。',place:'K-Citymarket／Prisma／S-market',tag:'藍莓茶'},
              {country:'🇫🇮 芬蘭',category:'🦛 嚕嚕米周邊',priority:'⭐ 必買',item:'Moomin 周邊／ARABIA・Iittala・Marimekko 聯名',reason:'芬蘭代表角色 IP；馬克杯、餐具、娃娃、文具與聯名商品都很適合收藏或送禮。',place:'Moomin Shop／Iittala／ARABIA／百貨／機場',tag:'收藏推薦'},
              {country:'🇫🇮 芬蘭',category:'💙 芬蘭保養品牌',priority:'⭐ 必買',item:'Lumene 保養品',reason:'芬蘭國民保養品牌；可優先看 Nordic Hydra 等保濕系列，適合乾冷氣候。',place:'Lyko／藥妝店／百貨／部分超市',tag:'芬蘭美妝'},
              {country:'🇫🇮 芬蘭',category:'🦌 拉普蘭特色',priority:'👍 推薦',item:'Marttiini 馴鹿皮手套',reason:'羅瓦涅米在地品牌，兼具實用與拉普蘭紀念性；手套比刀具更適合本趟購買。',place:'Rovaniemi／Lappish shops／戶外或紀念品店',tag:'拉普蘭特色'}
            ].map(decorate);
            var firstNorway=data.souvenirs.findIndex(function(x){return String(x.country||'').indexOf('挪威')>=0});
            if(firstNorway>=0)data.souvenirs.splice.apply(data.souvenirs,[firstNorway,0].concat(rows)); else data.souvenirs=data.souvenirs.concat(rows);
            var largeByName={}; Object.keys(files).forEach(function(name){largeByName[name]=local('large/'+files[name])});
            function overrideButton(button){
              var name=button&&button.dataset&&button.dataset.productName||''; var full=largeByName[name]; if(!full)return;
              var img=button.querySelector&&button.querySelector('.shopping-product-image'); if(img)button.dataset.productThumbnail=img.getAttribute('src')||'';
              button.dataset.productImage=full;
            }
            document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){document.querySelectorAll('.shopping-product-image-button[data-product-name]').forEach(overrideButton)},0)});
            document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.shopping-product-image-button[data-product-name]'); if(b)overrideButton(b)},true);
          })();
          '''
          Path('assets/finland-shopping-assets.js').write_text(js,encoding='utf-8')

          budget=Path('budget/index.html')
          html=budget.read_text(encoding='utf-8')
          new='<script src="../assets/finland-shopping-assets.js?v=20260909-assets1"></script>'
          if 'finland-shopping-assets.js' not in html:
            old='<script src="../assets/finland-shopping-extra.js?v=20260908-assets1"></script>'
            html=html.replace(old,old+'\n'+new)
          else:
            import re
            html=re.sub(r'<script src="\.\./assets/finland-shopping-assets\.js\?v=[^"]+"></script>',new,html)
          budget.write_text(html,encoding='utf-8')
          PY

      - name: Commit optimized Finland images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/optimize-finland-images.yml
          git add assets/shopping/finland/thumbs assets/shopping/finland/large assets/finland-shopping-assets.js budget/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Optimize and dedupe Finland shopping'
            git push origin main
          fi
