name: Optimize Vienna shopping images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-vienna-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image libraries
        run: pip install pillow pillow-avif-plugin

      - name: Build optimized thumbnails and large images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_avif
          import shutil

          root = Path('assets/shopping/vienna')
          thumbs = root / 'thumbs'
          large = root / 'large'
          shutil.rmtree(thumbs, ignore_errors=True)
          shutil.rmtree(large, ignore_errors=True)
          thumbs.mkdir(parents=True, exist_ok=True)
          large.mkdir(parents=True, exist_ok=True)

          mapping = {
            "Kelly's Chips Classic.jpg": "Kellys-Chips-Classic.png",
            "Alnatura Dinkel Mini Brezeln.jpg": "Alnatura-Dinkel-Mini-Brezeln.png",
            "SPAR Bio Apfelchips.jpg": "SPAR-Bio-Apfelchips.png",
            "BILLA Bio Schoko Haferkekse.avif": "BILLA-Bio-Schoko-Haferkekse.png",
            "Sondey Choco Wafer Rolls Dark Chocolate.jpg": "Sondey-Choco-Wafer-Rolls.png",
            "Ritter Sport Nussklasse Pistazie.jpg": "Ritter-Sport-Pistazie.png",
            "Lindt Dubai Style Chocolade.jpg": "Lindt-Dubai-Style.png",
            "Almdudler.jpg": "Almdudler.png",
            "Manner Original Neapolitaner 威化餅.png": "Manner-Original-Neapolitaner.png",
            "Darbo Rosenmarillen Konfitüre.png": "Darbo-Rosenmarillen.png",
            "DEMEL Kandierte Veilchen 糖漬紫羅蘭.png": "DEMEL-Kandierte-Veilchen.png",
            "Zotter 巧克力.png": "Zotter-Schokolade.png",
            "Kamill Hand & Nagelcreme Classic.jpg": "Kamill-Hand-Nagelcreme.png",
            "Clinical Melatonin Forte Original.png": "Clinical-Melatonin-Forte.png",
            "Balea Hyaluron Konzentrat（藍色補水款）.png": "Balea-Hyaluron-Konzentrat.png",
            "Ferrero Giotto 榛果威化小球.webp": "Ferrero-Giotto.png",
          }

          def prepare(im):
            im = ImageOps.exif_transpose(im)
            if im.mode not in ('RGB','RGBA'):
              im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
            return im

          def quantize(im):
            if im.mode == 'RGBA':
              return im.quantize(colors=256, method=Image.Quantize.FASTOCTREE, dither=Image.Dither.FLOYDSTEINBERG)
            return im.quantize(colors=256, method=Image.Quantize.MEDIANCUT, dither=Image.Dither.FLOYDSTEINBERG)

          for source_name, output_name in mapping.items():
            source = root / source_name
            if not source.exists():
              raise FileNotFoundError(source)
            with Image.open(source) as opened:
              base = prepare(opened)
              thumb = base.copy()
              thumb.thumbnail((320,320), Image.Resampling.LANCZOS)
              quantize(thumb).save(thumbs/output_name, format='PNG', optimize=True, compress_level=9)
              full = base.copy()
              full.thumbnail((1000,1000), Image.Resampling.LANCZOS)
              quantize(full).save(large/output_name, format='PNG', optimize=True, compress_level=9)

          print('thumb MB:', round(sum(p.stat().st_size for p in thumbs.glob('*.png'))/1024/1024, 2))
          print('large MB:', round(sum(p.stat().st_size for p in large.glob('*.png'))/1024/1024, 2))
          PY

      - name: Update Vienna image mapping
        run: |
          cat > assets/vienna-shopping-assets.js <<'JS'
          (function(){
            var data=window.AURORA_SHOPPING_DATA;
            if(!data)return;

            var base='../assets/shopping/vienna/';
            function local(file){return encodeURI(base+file)}
            function norm(value){return String(value||'').toLowerCase().replace(/[\s'’"“”()（）·・\-_/\\]+/g,'').trim()}

            var files={
              "Kelly's Chips Classic":'Kellys-Chips-Classic.png',
              'Alnatura Dinkel Mini Brezeln':'Alnatura-Dinkel-Mini-Brezeln.png',
              'pur Bio-Apfelchips geriffelt':'SPAR-Bio-Apfelchips.png',
              'BILLA Bio Schoko Haferkekse':'BILLA-Bio-Schoko-Haferkekse.png',
              'Sondey Choco Wafer Rolls Dark Chocolate':'Sondey-Choco-Wafer-Rolls.png',
              'Ritter Sport Nussklasse Pistazie':'Ritter-Sport-Pistazie.png',
              'Lindt Dubai Style Chocolade':'Lindt-Dubai-Style.png',
              'Almdudler':'Almdudler.png',
              'Manner Original Neapolitaner 威化餅':'Manner-Original-Neapolitaner.png',
              'Darbo Rosenmarillen Konfitüre':'Darbo-Rosenmarillen.png',
              'DEMEL Kandierte Veilchen 糖漬紫羅蘭':'DEMEL-Kandierte-Veilchen.png',
              'Zotter 巧克力':'Zotter-Schokolade.png',
              'Kamill Hand & Nagelcreme Classic':'Kamill-Hand-Nagelcreme.png',
              'Clinical Melatonin Forte Original':'Clinical-Melatonin-Forte.png',
              'Balea Hyaluron Konzentrat（藍色補水款）':'Balea-Hyaluron-Konzentrat.png',
              'Ferrero Giotto 榛果威化小球':'Ferrero-Giotto.png'
            };
            var fullByName={};
            function applyImage(product){
              var file=files[product.item];
              if(!file)return;
              product.image=local('thumbs/'+file);
              product.fullImage=local('large/'+file);
              fullByName[product.item]=product.fullImage;
            }

            var vienna=(data.supermarkets||[]).find(function(x){return String(x.city||'').indexOf('維也納')!==-1});
            var supermarketNames=new Set();
            if(vienna&&Array.isArray(vienna.groups)){
              vienna.groups.forEach(function(group){
                if(!Array.isArray(group.products))return;
                var seen=new Set();
                group.products=group.products.filter(function(product){
                  var key=norm(product.item);
                  if(!key||seen.has(key))return false;
                  seen.add(key);
                  supermarketNames.add(key);
                  applyImage(product);
                  return true;
                });
              });
            }

            var seenViennaSouvenirs=new Set();
            data.souvenirs=(data.souvenirs||[]).filter(function(product){
              if(String(product.country||'').indexOf('維也納')===-1)return true;
              var key=norm(product.item);
              if(!key||supermarketNames.has(key)||seenViennaSouvenirs.has(key))return false;
              seenViennaSouvenirs.add(key);
              applyImage(product);
              return true;
            });

            document.addEventListener('click',function(event){
              var button=event.target.closest&&event.target.closest('[data-product-image][data-product-name]');
              if(!button)return;
              var full=fullByName[button.dataset.productName];
              if(full)button.dataset.productImage=full;
            },true);
          })();
          JS

      - name: Commit optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/shopping/vienna/thumbs assets/shopping/vienna/large assets/vienna-shopping-assets.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Optimize Vienna shopping images'
            git push origin main
          fi
