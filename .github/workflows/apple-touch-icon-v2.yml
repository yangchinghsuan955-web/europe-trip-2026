name: Fix iOS home screen icon

on:
  push:
    paths:
      - '.github/workflows/apple-touch-icon-v2.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build true-color iOS icon and update references
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('assets/app-icons/06A7E4CE-2A0A-437E-A785-8EFF6C5A8D70.png')
          out = Path('assets/apple-touch-icon-v2.png')

          im = Image.open(src).convert('RGB')
          im = ImageOps.pad(im, (180, 180), method=Image.Resampling.LANCZOS, color=(16, 45, 62), centering=(0.5, 0.5))
          im.save(out, format='PNG', optimize=True, compress_level=9)

          check = Image.open(out)
          assert check.size == (180, 180), check.size
          assert check.mode == 'RGB', check.mode
          assert 'A' not in check.getbands(), check.getbands()
          print(f'Created {out}: size={check.size}, mode={check.mode}, bands={check.getbands()}')

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('apple-touch-icon.png', 'apple-touch-icon-v2.png')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated HTML files:')
          for p in changed:
              print(' -', p)
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apple-touch-icon-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix iOS home screen icon rendering'
          git push origin HEAD:main
