name: Build optimized UI images

on:
  push:
    branches:
      - perf/optimized-ui-images-20260914
    paths:
      - .github/workflows/build-optimized-ui-images.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimized-ui-images-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build display images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path("assets/skin")
          out = root / "optimized"
          out.mkdir(parents=True, exist_ok=True)

          jobs = [
              ("首頁.png", "hero.webp", 1960, 86),
              ("CEAC510F-7333-464B-A71A-9A98324A0347.png", "nav-daily.webp", 256, 88),
              ("5CB28D8D-8530-43BD-A822-2122162B9225.png", "nav-transport.webp", 256, 88),
              ("9A402E72-D080-448D-B7E2-BA94C7BDCD87.png", "nav-stay.webp", 256, 88),
              ("4F81B1FA-E781-4604-B7FF-7387BB719789.png", "nav-tools.webp", 256, 88),
              ("E54BF95C-E31A-4067-B470-A61AFDBF7954.png", "nav-budget.webp", 256, 88),
          ]

          for source_name, output_name, max_width, quality in jobs:
              with Image.open(root / source_name) as image:
                  image.load()
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                  image.save(out / output_name, "WEBP", quality=quality, method=6)
                  print(f"{source_name}: {image.width}x{image.height} -> {output_name}")
      - name: Verify generated images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          expected = {
              "hero.webp": 700_000,
              "nav-daily.webp": 120_000,
              "nav-transport.webp": 120_000,
              "nav-stay.webp": 120_000,
              "nav-tools.webp": 120_000,
              "nav-budget.webp": 120_000,
          }
          for name, limit in expected.items():
              path = Path("assets/skin/optimized") / name
              assert path.exists(), f"Missing {path}"
              assert path.stat().st_size <= limit, f"{path} is too large"
              with Image.open(path) as image:
                  image.verify()
              print(f"{name}: {path.stat().st_size} bytes")
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skin/optimized
          git diff --cached --quiet && exit 0
          git commit -m "perf: generate optimized UI images"
          git push origin HEAD:perf/optimized-ui-images-20260914
