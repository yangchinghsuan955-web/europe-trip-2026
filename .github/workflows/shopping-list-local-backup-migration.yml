name: Shopping list local backup migration

on:
  push:
    paths:
      - '.github/workflows/shopping-list-local-backup-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add local backup, restore and share tools
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('budget/index.html')
          s = p.read_text(encoding='utf-8')

          css_old = ".empty-list{padding:18px 0;color:var(--muted);text-align:center}.device-note{margin-top:10px;color:var(--muted);font-size:12px}.image-modal{"
          css_new = ".empty-list{padding:18px 0;color:var(--muted);text-align:center}.device-note{margin-top:10px;color:var(--muted);font-size:12px}.shopping-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.shopping-tools .form-btn{flex:1 1 150px}.shopping-backup-status{min-height:18px;margin:9px 0 0;color:var(--muted);font-size:12px}.image-modal{"
          assert css_old in s, 'CSS anchor not found'
          s = s.replace(css_old, css_new, 1)

          html_old = '''        <div class="notice"><div class="notice-icon">📝</div><div><strong>我的購物清單</strong><p>每位團員可在自己的手機建立要買的物品，勾選已購買並隨時修改。</p></div></div>
        <article class="info-card">
          <h3 id="shoppingFormTitle">＋ 新增購物項目</h3>'''
          html_new = '''        <div class="notice"><div class="notice-icon">📝</div><div><strong>我的購物清單</strong><p>每位團員可在自己的手機建立要買的物品，勾選已購買並隨時修改。</p></div></div>
        <article class="info-card">
          <h3>📦 本機保存與備份</h3>
          <p style="margin-top:0;color:var(--muted)">清單會自動儲存在目前手機與瀏覽器。重要新增後可備份成通用 JSON 檔，iPhone／Android 都能還原。</p>
          <div class="shopping-tools">
            <button class="form-btn" id="backupShoppingList" type="button">備份到手機</button>
            <button class="form-btn secondary" id="restoreShoppingList" type="button">還原備份</button>
            <button class="form-btn secondary" id="shareShoppingList" type="button">分享清單</button>
          </div>
          <input id="shoppingRestoreFile" type="file" accept=".json,application/json" hidden>
          <p class="device-note">📱 備份時請選擇手機本機位置：iPhone 可選「我的 iPhone」，Android 可選「下載／Files」等本機資料夾；不會自動上傳雲端。</p>
          <p class="shopping-backup-status" id="shoppingBackupStatus" role="status" aria-live="polite"></p>
        </article>
        <article class="info-card">
          <h3 id="shoppingFormTitle">＋ 新增購物項目</h3>'''
          assert html_old in s, 'shopping section anchor not found'
          s = s.replace(html_old, html_new, 1)

          note_old = '          <p class="device-note">🔒 清單只儲存在目前瀏覽器／裝置，不會同步給其他團員，也不會上傳到網站。</p>'
          note_new = '          <p class="device-note">🔒 每次新增、修改與勾選都會自動保存在目前瀏覽器／裝置；不會同步給其他團員，也不會上傳到網站。</p>'
          assert note_old in s, 'device note anchor not found'
          s = s.replace(note_old, note_new, 1)

          js_old = '''  function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
  function render(){const box=$('#shoppingList');'''
          js_new = '''  function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
  function setBackupStatus(message){const el=$('#shoppingBackupStatus');if(el)el.textContent=message||''}
  function backupFilename(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return `極光旅行購物清單_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`}
  function backupPayload(){return {type:'aurora-shopping-list-backup',version:1,exportedAt:new Date().toISOString(),items}}
  async function backupToDevice(){
    const file=new File([JSON.stringify(backupPayload(),null,2)],backupFilename(),{type:'application/json'});
    try{
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({title:'極光旅行購物清單備份',files:[file]});
        setBackupStatus('已開啟系統儲存／分享選單；請確認選擇手機本機資料夾。');
        return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    setBackupStatus('備份檔已下載；請確認檔案保存在手機本機資料夾。');
  }
  function normalizeBackupItems(rows){if(!Array.isArray(rows))throw new Error('備份格式不正確');return rows.filter(x=>x&&typeof x.name==='string'&&x.name.trim()).map(x=>({name:String(x.name).trim().slice(0,80),country:String(x.country||'其他').slice(0,20),city:String(x.city||'').slice(0,40),qty:Math.max(1,Math.min(999,Number(x.qty)||1)),budget:String(x.budget||'').slice(0,30),forWho:String(x.forWho||'').slice(0,50),note:String(x.note||'').slice(0,180),done:!!x.done}))}
  async function restoreFromFile(file){
    try{
      const parsed=JSON.parse(await file.text()),rows=Array.isArray(parsed)?parsed:parsed&&parsed.items,restored=normalizeBackupItems(rows);
      if(!confirm(`將以備份檔的 ${restored.length} 項取代目前 ${items.length} 項購物清單，確定還原嗎？`)){setBackupStatus('已取消還原，原本清單沒有變更。');return}
      items=restored;save();resetForm();setBackupStatus(`還原完成：共 ${items.length} 項。`);
    }catch(e){setBackupStatus('無法還原：請確認選擇的是本頁匯出的 JSON 備份檔。')}
  }
  function shoppingShareText(){
    if(!items.length)return '🛍️ 2026 極光旅行購物清單\\n目前沒有購物項目。';
    const groups={};items.forEach(x=>(groups[x.country||'其他']||(groups[x.country||'其他']=[])).push(x));
    const lines=['🛍️ 2026 極光旅行購物清單'];Object.entries(groups).forEach(([country,rows])=>{lines.push('',`【${country}】`);rows.forEach(x=>lines.push(`${x.done?'☑':'☐'} ${x.name} × ${Number(x.qty)||1}${x.city?'｜'+x.city:''}${x.forWho?'｜給 '+x.forWho:''}${x.budget?'｜預算 '+x.budget:''}${x.note?'｜'+x.note:''}`))});return lines.join('\\n')
  }
  async function shareShoppingList(){
    const text=shoppingShareText();
    try{if(navigator.share){await navigator.share({title:'極光旅行購物清單',text});setBackupStatus('已開啟分享選單。');return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(text);setBackupStatus('此瀏覽器未提供分享選單，已將清單複製到剪貼簿。')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();setBackupStatus('已將清單複製到剪貼簿。')}
  }
  function render(){const box=$('#shoppingList');'''
          assert js_old in s, 'JS save/render anchor not found'
          s = s.replace(js_old, js_new, 1)

          listeners_old = '''  $('#clearBought').addEventListener('click',()=>{items=items.filter(x=>!x.done);save();resetForm()});
  $('#souvenirList').addEventListener('click',e=>{const b=e.target.closest('[data-add-item]');if(!b)return;items.push({name:b.dataset.addItem,country:b.dataset.addCountry||'其他',city:'',qty:1,budget:'',forWho:'',note:'',done:false});save();$$('#foodSegments .segment').find(x=>x.dataset.foodView==='shopping').click()});'''
          listeners_new = '''  $('#clearBought').addEventListener('click',()=>{items=items.filter(x=>!x.done);save();resetForm()});
  $('#backupShoppingList').addEventListener('click',backupToDevice);
  $('#restoreShoppingList').addEventListener('click',()=>{const input=$('#shoppingRestoreFile');input.value='';input.click()});
  $('#shoppingRestoreFile').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(file)restoreFromFile(file)});
  $('#shareShoppingList').addEventListener('click',shareShoppingList);
  $('#souvenirList').addEventListener('click',e=>{const b=e.target.closest('[data-add-item]');if(!b)return;items.push({name:b.dataset.addItem,country:b.dataset.addCountry||'其他',city:'',qty:1,budget:'',forWho:'',note:'',done:false});save();$$('#foodSegments .segment').find(x=>x.dataset.foodView==='shopping').click()});'''
          assert listeners_old in s, 'listener anchor not found'
          s = s.replace(listeners_old, listeners_new, 1)

          # Basic guardrails.
          assert s.count('id="backupShoppingList"') == 1
          assert s.count('id="restoreShoppingList"') == 1
          assert s.count('id="shareShoppingList"') == 1
          assert 'aurora-shopping-list-v1' in s
          assert 'navigator.canShare' in s
          assert 'shoppingRestoreFile' in s
          assert '<nav class="bottom-nav"' in s and 'aria-current="page"' in s

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html
          git commit -m 'Add local shopping list backup and restore'
          git push origin main
