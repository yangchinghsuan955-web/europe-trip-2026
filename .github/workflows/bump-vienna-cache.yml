name: Bump Vienna shopping cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-vienna-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('budget/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('vienna-shopping-assets.js?v=20260908-assets1','vienna-shopping-assets.js?v=20260908-assets2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Vienna shopping image cache'
          git push origin main
