name: Build shopping thumbnails

on:
  push:
    branches:
      - perf/shopping-thumbnails-20260914
    paths:
      - .github/workflows/build-shopping-thumbnails.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/shopping-thumbnails-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate 160px WebP thumbnails and mapping
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, UnidentifiedImageError
          import json

          root = Path("assets/shopping")
          output_root = root / "optimized" / "thumbs"
          supported = {".png", ".jpg", ".jpeg", ".webp", ".avif"}
          mapping = {}
          generated = 0

          for source in sorted(root.rglob("*")):
              if not source.is_file() or source.suffix.lower() not in supported:
                  continue
              relative = source.relative_to(root)
              if any(part in {"thumbs", "large", "optimized"} for part in relative.parts):
                  continue
              target = output_root / relative.with_suffix(".webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  with Image.open(source) as image:
                      image.load()
                      image.thumbnail((160, 160), Image.Resampling.LANCZOS)
                      if image.mode not in {"RGB", "RGBA"}:
                          image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                      image.save(target, "WEBP", quality=86, method=6)
              except (UnidentifiedImageError, OSError) as error:
                  print(f"Skipped unreadable image {source}: {error}")
                  continue
              original_url = "../assets/shopping/" + relative.as_posix()
              thumb_url = "../assets/shopping/optimized/thumbs/" + relative.with_suffix(".webp").as_posix()
              mapping[original_url] = thumb_url
              generated += 1

          module = """(function(root){\n  'use strict';\n  var THUMBS = %s;\n  function apply(product){\n    if(!product || !product.image) return;\n    var image = String(product.image);\n    var key = image.split('?')[0];\n    var thumb = THUMBS[key];\n    if(!thumb) return;\n    var full = product.imageFull || product.fullImage || image;\n    product.imageFull = full;\n    product.fullImage = full;\n    product.image = thumb + '?v=20260914-shopthumb1';\n  }\n  var data = root.AURORA_SHOPPING_DATA || {};\n  (data.supermarkets || []).forEach(function(section){\n    (section.groups || []).forEach(function(group){\n      (group.products || []).forEach(apply);\n    });\n  });\n  (data.souvenirs || []).forEach(apply);\n  root.TravelShoppingThumbnailMap = Object.freeze(THUMBS);\n})(window);\n""" % json.dumps(mapping, ensure_ascii=False, separators=(",", ":"))
          module_path = Path("assets/modules/shopping/shopping-image-assets.js")
          module_path.write_text(module, encoding="utf-8")
          print(f"Generated {generated} thumbnails and {len(mapping)} mappings")
      - name: Verify thumbnails
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import re

          files = sorted(Path("assets/shopping/optimized/thumbs").rglob("*.webp"))
          assert files, "No thumbnails generated"
          total = 0
          for path in files:
              assert path.stat().st_size <= 80_000, f"Thumbnail too large: {path}"
              with Image.open(path) as image:
                  image.load()
                  assert image.width <= 160 and image.height <= 160, f"Wrong size: {path} {image.size}"
              total += path.stat().st_size
          module = Path("assets/modules/shopping/shopping-image-assets.js").read_text(encoding="utf-8")
          assert module.count("../assets/shopping/optimized/thumbs/") == len(files)
          print(f"Verified {len(files)} thumbnails, total {total} bytes")
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shopping/optimized/thumbs assets/modules/shopping/shopping-image-assets.js
          git diff --cached --quiet && exit 0
          git commit -m "perf: generate shopping thumbnails"
          git push origin HEAD:perf/shopping-thumbnails-20260914
