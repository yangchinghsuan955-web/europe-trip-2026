name: Validate shopping thumbnails

on:
  push:
    branches:
      - perf/shopping-thumbnails-20260914
    paths:
      - .github/workflows/build-shopping-thumbnails.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/shopping-thumbnails-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify files, dimensions, originals, and integration
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import json
          import re

          thumb_root = Path("assets/shopping/optimized/thumbs")
          files = sorted(thumb_root.rglob("*.webp"))
          assert len(files) == 76, f"Expected 76 thumbnails, got {len(files)}"
          total = 0
          for path in files:
              size = path.stat().st_size
              assert size <= 80_000, f"Thumbnail too large: {path} ({size})"
              with Image.open(path) as image:
                  image.load()
                  assert image.width <= 160 and image.height <= 160, f"Wrong dimensions: {path} {image.size}"
              total += size

          module = Path("assets/modules/shopping/shopping-image-assets.js").read_text(encoding="utf-8")
          match = re.search(r"var THUMBS = (\{.*?\});", module)
          assert match, "Thumbnail map not found"
          mapping = json.loads(match.group(1))
          assert len(mapping) == 76, f"Expected 76 mappings, got {len(mapping)}"
          for original_url, thumb_url in mapping.items():
              assert original_url.startswith("../assets/shopping/")
              assert thumb_url.startswith("../assets/shopping/optimized/thumbs/")
              original = Path(original_url.removeprefix("../"))
              thumb = Path(thumb_url.removeprefix("../"))
              assert original.is_file(), f"Missing original: {original}"
              assert thumb.is_file(), f"Missing thumbnail: {thumb}"

          bootstrap = Path("assets/modules/shopping/bootstrap.js").read_text(encoding="utf-8")
          assert "../assets/shopping-data.js?v=20260914-shopthumb1" in bootstrap
          assert bootstrap.rfind("shopping-image-assets.js?v=20260914-shopthumb1") > bootstrap.rfind("vienna-shopping-assets.js")
          budget = Path("budget/index.html").read_text(encoding="utf-8")
          assert "bootstrap.js?v=20260914-shopthumb1" in budget

          renderer = Path("assets/shopping-data.js").read_text(encoding="utf-8")
          assert "var thumb=p.image,full=p.imageFull||p.fullImage||thumb;" in renderer
          assert "data-product-image" in renderer and "esc(full)" in renderer
          assert "data-product-thumbnail" in renderer and "esc(thumb)" in renderer
          assert 'loading="lazy" decoding="async"' in renderer
          assert "rootMargin:'700px 0px'" not in renderer
          assert "button.addEventListener('touchstart',function(){warm(button.dataset.productImage)" not in renderer
          print(f"Verified {len(files)} thumbnails ({total} bytes), originals, loader order, and deferred full images")
      - name: Check JavaScript syntax
        run: |
          node --check assets/shopping-data.js
          node --check assets/modules/shopping/bootstrap.js
          node --check assets/modules/shopping/shopping-image-assets.js
      - name: Verify thumbnail/full-image runtime mapping
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const original = '../assets/shopping/vienna/SPAR-Bio-Apfelchips.png';
          const product = { image: original };
          const context = { window: { AURORA_SHOPPING_DATA: {
            supermarkets: [{ groups: [{ products: [product] }] }],
            souvenirs: []
          }}};
          vm.runInNewContext(
            fs.readFileSync('assets/modules/shopping/shopping-image-assets.js', 'utf8'),
            context
          );
          if (!product.image.startsWith('../assets/shopping/optimized/thumbs/')) {
            throw new Error('List image was not changed to a thumbnail');
          }
          if (product.imageFull !== original || product.fullImage !== original) {
            throw new Error('Full-image URL was not preserved');
          }
          console.log('Runtime mapping preserves the original while rendering the thumbnail');
          NODE
