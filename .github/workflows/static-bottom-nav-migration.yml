name: One-time static bottom navigation migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/static-bottom-nav-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch navigation architecture
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "20260908-nav1"

          ICONS = {
              'days': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path></svg>',
              'transport': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17h14M6 17l-1 3M18 17l1 3M6 4h12l2 10H4L6 4Z"></path><circle cx="8" cy="14" r="1"></circle><circle cx="16" cy="14" r="1"></circle></svg>',
              'hotels': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 20V7l9-4 9 4v13M7 20v-5h10v5M8 9h.01M12 9h.01M16 9h.01M8 12h.01M12 12h.01M16 12h.01"></path></svg>',
              'luggage': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="6" width="14" height="15" rx="2"></rect><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M9 10v7M15 10v7"></path></svg>',
              'budget': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>',
          }

          ITEMS = [
              ('days', 'daily/', 'nav-days', '每日行程'),
              ('transport', 'transport/', 'nav-transport', '交通'),
              ('hotels', 'stay/', 'nav-hotels', '住宿'),
              ('luggage', 'prep-tools/', 'nav-luggage', '行前工具'),
              ('budget', 'budget/', 'nav-budget', '餐食與購物'),
          ]

          def current_key(path: Path):
              s = path.as_posix()
              if s.startswith('daily/'):
                  return 'days'
              if s.startswith('transport/'):
                  return 'transport'
              if s.startswith('stay/'):
                  return 'hotels'
              if s.startswith('prep-tools/'):
                  return 'luggage'
              if s.startswith('budget/'):
                  return 'budget'
              raise AssertionError(f'Unknown navigation page: {s}')

          def make_nav(path: Path):
              prefix = '../' * len(path.parent.parts)
              active = current_key(path)
              parts = ['<nav class="bottom-nav" aria-label="主要導覽">']
              for key, target, nav_id, label in ITEMS:
                  aria = ' aria-current="page"' if key == active else ''
                  parts.append(f'  <a class="nav-btn" href="{prefix}{target}" id="{nav_id}"{aria}>{ICONS[key]}{label}</a>')
              parts.append('</nav>')
              return '\n'.join(parts)

          def normalize_active_panel(text: str, page_key: str):
              desired = {'days':'days', 'transport':'transport', 'hotels':'hotels', 'luggage':'luggage'}.get(page_key)
              if not desired:
                  return text
              pattern = re.compile(r'<section class="tab-panel(?: active)?" id="tab-(days|transport|hotels|luggage|budget)"')
              def repl(m):
                  key = m.group(1)
                  cls = 'tab-panel active' if key == desired else 'tab-panel'
                  return f'<section class="{cls}" id="tab-{key}"'
              return pattern.sub(repl, text)

          def strip_legacy_page_nav_scripts(text: str):
              script_re = re.compile(r'<script>(.*?)</script>', re.S)
              def repl(m):
                  body = m.group(1)
                  if '.bottom-nav' in body and ('window.location.href' in body or 'const wanted' in body or 'let wanted' in body):
                      return ''
                  body = re.sub(
                      r"document\.querySelector\((['\"])\.bottom-nav.*?\1\)\?\.classList\.add\((['\"])active\2\);?",
                      '', body
                  )
                  return '<script>' + body + '</script>'
              return script_re.sub(repl, text)

          candidates = [
              Path('daily/index.html'),
              Path('transport/index.html'),
              Path('stay/index.html'),
              Path('budget/index.html'),
          ] + sorted(Path('prep-tools').rglob('*.html'))

          # Redirect-only compatibility files (for example prep-tools/apps.html) have no bottom nav and are intentionally left untouched.
          html_files = [
              path for path in candidates
              if '<nav class="bottom-nav"' in path.read_text(encoding='utf-8')
          ]

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              page_key = current_key(path)
              text = normalize_active_panel(text, page_key)

              text, nav_count = re.subn(
                  r'<nav class="bottom-nav" aria-label="主要導覽">.*?</nav>',
                  make_nav(path),
                  text,
                  count=1,
                  flags=re.S,
              )
              if nav_count != 1:
                  raise AssertionError(f'{path}: expected exactly one bottom nav, got {nav_count}')

              text = strip_legacy_page_nav_scripts(text)
              text = text.replace('.nav-btn.active', '.nav-btn[aria-current="page"]')

              text = re.sub(r'common\.css(?:\?v=[^"\']+)?', f'common.css?v={VERSION}', text)
              text = re.sub(r'common\.js(?:\?v=[^"\']+)?', f'common.js?v={VERSION}', text)
              text = re.sub(r'subpage-runtime\.js(?:\?v=[^"\']+)?', f'subpage-runtime.js?v={VERSION}', text)
              path.write_text(text, encoding='utf-8')

          # Remove only the five-main-page state machine. Other localStorage state remains intact.
          common_js = Path('assets/common.js')
          js = common_js.read_text(encoding='utf-8')
          js, n_tab = re.subn(r'\n\s*tab:\s*stored\("aurora-tab"\)\s*\|\|\s*"days",', '', js, count=1)
          if n_tab != 1:
              raise AssertionError(f'common.js: aurora-tab state line match count={n_tab}')

          js, n_show = re.subn(
              r'\n\s*function showTab\(tab, scroll = true\) \{.*?\n\s*\}\n\n(?=\s*function renderNotices)',
              '\n\n', js, count=1, flags=re.S,
          )
          if n_show != 1:
              raise AssertionError(f'common.js: showTab function match count={n_show}')

          js, n_init_show = re.subn(r'\n\s*showTab\(state\.tab,false\);', '', js, count=1)
          js, n_nav_listener = re.subn(
              r'\n\s*\$\$\("\.nav-btn"\)\.forEach\(btn=>btn\.addEventListener\("click",\(\)=>showTab\(btn\.dataset\.tab\)\)\);',
              '', js, count=1,
          )
          if n_init_show != 1 or n_nav_listener != 1:
              raise AssertionError(f'common.js: init removals show={n_init_show}, listener={n_nav_listener}')
          if 'aurora-tab' in js or 'function showTab' in js or 'state.tab' in js:
              raise AssertionError('common.js: legacy main-tab state still present')
          common_js.write_text(js, encoding='utf-8')

          common_css = Path('assets/common.css')
          css = common_css.read_text(encoding='utf-8')
          css = re.sub(
              r'\n\.bottom-nav \.nav-btn:last-child\{font-size:0!important\}\n\.bottom-nav \.nav-btn:last-child::after\{content:"餐食與購物";font-size:10px;line-height:1\.2;font-weight:750\}\n',
              '\n', css, count=1,
          )
          css = css.replace('.nav-btn.active', '.nav-btn[aria-current="page"]')
          common_css.write_text(css, encoding='utf-8')

          common_base = Path('assets/common-base.css')
          base = common_base.read_text(encoding='utf-8').replace('.nav-btn.active', '.nav-btn[aria-current="page"]')
          common_base.write_text(base, encoding='utf-8')

          readme = Path('README.md')
          rd = readme.read_text(encoding='utf-8')
          rd = rd.replace('| 行前與工具 | `prep-tools/` | 購票 App、入境、待辦、行李、退稅 |', '| 行前工具 | `prep-tools/` | 購票 App、入境、待辦、行李、退稅 |')
          rd = rd.replace('| 預算 | `budget/index.html` | 旅費與預算資訊 |', '| 餐食與購物 | `budget/index.html` | 每日餐食、超市採買、伴手禮與購物清單 |')
          rd = rd.replace('每日行程 → 交通 → 住宿 → 行前與工具 → 預算', '每日行程 → 交通 → 住宿 → 行前工具 → 餐食與購物')
          rd = rd.replace('如果只是修改預算，改 `budget/index.html`。', '如果只是修改餐食與購物，改 `budget/index.html`。')
          readme.write_text(rd, encoding='utf-8')

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              nav_match = re.search(r'<nav class="bottom-nav" aria-label="主要導覽">(.*?)</nav>', text, re.S)
              if not nav_match:
                  raise AssertionError(f'{path}: nav missing after patch')
              nav = nav_match.group(1)
              current_count = nav.count('aria-current="page"')
              if current_count != 1:
                  raise AssertionError(f'{path}: aria-current count={current_count}')
              if '<button' in nav or 'data-tab=' in nav or ' active' in nav:
                  raise AssertionError(f'{path}: legacy button/data-tab/active remains in nav')
              if '餐食與購物' not in nav or '行前工具' not in nav:
                  raise AssertionError(f'{path}: canonical nav labels missing')
              if f'common.css?v={VERSION}' not in text:
                  raise AssertionError(f'{path}: common.css cache version not normalized')
              if 'common.js' in text and f'common.js?v={VERSION}' not in text:
                  raise AssertionError(f'{path}: common.js cache version not normalized')
              for script_body in re.findall(r'<script>(.*?)</script>', text, re.S):
                  if '.bottom-nav' in script_body and ('window.location.href' in script_body or 'classList.add' in script_body or 'classList.toggle' in script_body):
                      raise AssertionError(f'{path}: legacy JS still mutates/intercepts bottom nav')

          css = common_css.read_text(encoding='utf-8')
          if 'last-child::after{content:"餐食與購物"' in css:
              raise AssertionError('common.css: pseudo text replacement still present')
          if '.nav-btn.active' in css or '.nav-btn.active' in common_base.read_text(encoding='utf-8'):
              raise AssertionError('CSS: active selector still controls bottom nav')
          if '.bottom-nav .nav-btn[aria-current="page"]' not in css:
              raise AssertionError('common.css: aria-current selected state missing')

          print(f'Patched and verified {len(html_files)} visible HTML pages plus shared CSS/JS.')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/common.css assets/common-base.css assets/common.js daily transport stay prep-tools budget
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix bottom navigation state and links"
          git push origin HEAD:main
